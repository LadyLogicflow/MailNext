# Produktion (Coolify). Nur diese Datei wird dort verwendet.
# Geheim ist genau eine Variable: MAILNEXT_HAUPTSCHLUESSEL (ohne Standardwert, wird
# von EFINITI im Coolify eingetragen). Fehlt sie, meldet /health "hauptschluessel_fehlt".
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SERVICE_FQDN_APP: ""
      MAILNEXT_HAUPTSCHLUESSEL: "${MAILNEXT_HAUPTSCHLUESSEL:-}"
      SORTNEXT_BASE_URL: "${SORTNEXT_BASE_URL:-https://sortnext.bst-next.de}"
      MAILNEXT_DATEN: "/data"
    volumes:
      - mailnext-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - default
      - coolify

volumes:
  mailnext-data:

networks:
  coolify:
    external: true
